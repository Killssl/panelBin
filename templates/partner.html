<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/partner.css">
  <link rel="stylesheet" href="/static/css/styles.css">

<style>
/* ─── Cards grid ─── */
.weekly-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
  padding-bottom: 20px;
}

.wcard {
  background: var(--surface, #0f1c2e);
  border: 1px solid #1e3a5f;
  border-radius: 12px;
  overflow: hidden;
  transition: border-color .2s;
}
.wcard:hover { border-color: rgba(99,102,241,.4); }

.wcard-header {
  padding: 12px 16px 10px;
  background: rgba(99,102,241,.07);
  border-bottom: 1px solid #1e3a5f;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.wcard-title {
  font-size: 1.03rem;
  font-weight: 700;
  color: #c7d2fe;
  line-height: 1.3;
}

.wcard-badge {
  font-size: 0.88rem;
  color: var(--muted);
  white-space: nowrap;
  margin-top: 2px;
  flex-shrink: 0;
}

.wcard-rows {
  padding: 8px 0 4px;
}

.wrow {
  display: grid;
  grid-template-columns: 22px 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 4px 14px;
  transition: background .1s;
}
.wrow:hover { background: rgba(255,255,255,.03); }

.wrow-top .wrow-country { color: #e2e8f0; font-weight: 600; }
.wrow-top .wrow-uniq    { color: #34d47a; }

.wrow-rank {
  font-size: 0.88rem;
  color: rgba(255,255,255,.2);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.wrow-country {
  font-size: 0.97rem;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wrow-bar-wrap {
  width: 80px;
  height: 4px;
  background: rgba(255,255,255,.07);
  border-radius: 2px;
  overflow: hidden;
}
.wrow-bar {
  height: 100%;
  background: linear-gradient(90deg, #4f46e5, #7c3aed);
  border-radius: 2px;
  transition: width .3s;
}
.wrow-top .wrow-bar {
  background: linear-gradient(90deg, #059669, #34d47a);
}

.wrow-uniq {
  font-size: 0.95rem;
  font-weight: 600;
  color: #64748b;
  font-variant-numeric: tabular-nums;
  text-align: right;
  min-width: 44px;
}

/* ─── Copy button in weekly card ─── */
.wcard-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.wcard-header-left {
  flex: 1;
  min-width: 0;
}
.wcopy-btn {
  flex-shrink: 0;
  font-size: 0.88rem;
  padding: 3px 9px;
  border: 1px solid rgba(99,102,241,.3);
  border-radius: 5px;
  background: rgba(99,102,241,.08);
  color: #a5b4fc;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  margin-top: 2px;
}
.wcopy-btn:hover {
  background: rgba(99,102,241,.2);
  border-color: #818cf8;
  color: #fff;
}
.wcopy-btn.wcopy-done {
  background: rgba(34,197,94,.12);
  border-color: rgba(34,197,94,.4);
  color: #4ade80;
}

/* ─── "Готовы" tag ─── */
.wrow {
  grid-template-columns: 22px 1fr auto auto auto !important;
}
.wrow-tag {
  font-size: 0.83rem;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(234,179,8,.2);
  color: rgba(234,179,8,.35);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  user-select: none;
}
.wrow-tag.active {
  border-color: rgba(234,179,8,.55);
  color: var(--accent2);
  background: rgba(234,179,8,.08);
}
.wrow-tag:hover {
  border-color: rgba(234,179,8,.8);
  color: #fde68a;
}

.wk-meta {
  display: flex;
  align-items: center;
  gap: 0;
  font-size: 0.93rem;
  color: var(--text2, #94a3b8);
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.wk-meta b { color: #e2e8f0; font-weight: 600; }
.wk-meta-sep { margin: 0 10px; opacity: .3; }
.wk-fd-badge {
  font-size: 0.78em;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(62,207,142,.12);
  color: #3ecf8e;
  white-space: nowrap;
  font-weight: 600;
}
</style>
</head>
<body>

<!-- ── LOGIN ────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Partner Portal</div>
    <div class="login-sub">Войдите чтобы продолжить</div>
    <div class="field">
      <label>Логин</label>
      <input class="inp" id="lUser" type="text" placeholder="username" autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input class="inp" id="lPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="err-msg" id="lErr"></div>
    <button class="btn primary full" id="lBtn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="header-logo">⚡ Partner</div>
    <div class="header-user">Вы вошли как <span id="hUser"></span></div>
    <div class="spacer"></div>
    <button class="btn" onclick="doLogout()">Выйти</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="my_offers" onclick="switchTab('my_offers')">🎯 Мои офферы</div>
    <div class="tab" data-tab="traffic" onclick="switchTab('traffic')">📈 Трафик</div>
    <div class="tab" data-tab="new" onclick="switchTab('new')">＋ Новая заявка</div>
    <div class="tab" data-tab="requests" onclick="switchTab('requests')">
      📩 Мои заявки <span id="pendingBadge" style="display:none;margin-left:4px;background:var(--yellow);color:#000;border-radius:10px;padding:1px 6px;font-size:.7em"></span>
    </div>
  </div>

  <div class="main">

    <!-- OFFERS PAGE -->
    <div class="page active" id="page-my_offers">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
        <button onclick="loadMyOffers(true)"
          style="padding:6px 14px;border-radius:20px;border:1px solid #1e3a5f;background:#0d1b2e;color:#60a5fa;cursor:pointer;font-size:.82em">
          🔄 Обновить
        </button>
        <div style="width:1px;height:20px;background:#1e3a5f"></div>
        <button class="mo-filter active" onclick="setMyOffersFilter('active', this)"
          style="padding:6px 14px;border-radius:20px;border:1px solid #1e3a5f;background:#0d1b2e;color:#10b981;cursor:pointer;font-size:.82em">
          ● Активные
        </button>
        <button class="mo-filter" onclick="setMyOffersFilter('stopped', this)"
          style="padding:6px 14px;border-radius:20px;border:1px solid #1e3a5f;background:#0d1b2e;color:#ef4444;cursor:pointer;font-size:.82em">
          ● Стопнутые
        </button>
        <button class="mo-filter" onclick="setMyOffersFilter('all', this)"
          style="padding:6px 14px;border-radius:20px;border:1px solid #1e3a5f;background:#0d1b2e;color:#94a3b8;cursor:pointer;font-size:.82em">
          Все
        </button>
      </div>
      <div id="myOffersList"><div class="empty"><div class="empty-icon">⏳</div>Загрузка...</div></div>
    </div>

    <div class="page" id="page-offers">
      <div class="section-title">Доступные офферы</div>
      <div id="offersList"><div class="empty"><div class="spinner"></div></div></div>
    </div>

    <!-- TRAFFIC PAGE -->
    <div class="page" id="page-traffic">
      <div id="trafficContent"><div class="empty"><div class="empty-icon">⏳</div>Загрузка...</div></div>
    </div>

    <!-- NEW REQUEST PAGE -->
    <div class="page" id="page-new">
      <div class="section-title">Новая заявка на оффер</div>
      <div class="card">
        <div class="form-grid">

          <!-- Подход (мультивыбор) -->
          <div class="field span2">
            <label>Подход * <span style="color:var(--text2);font-size:.8em">(можно выбрать несколько)</span></label>
            <div class="chip-group" id="rApproachGroup">
              <div class="chip" data-val="Crash" onclick="toggleChip(this)">🎯 Crash</div>
              <div class="chip" data-val="Casino" onclick="toggleChip(this)">🎰 Casino</div>
              <div class="chip" data-val="Betting" onclick="toggleChip(this)">⚽ Betting</div>
            </div>
          </div>

          <!-- Базовый оффер из Binom -->
          <div class="field span2">
            <label>Базовый оффер из Binom <span style="color:var(--text2);font-size:.8em">(подставит постбек и настройки)</span></label>
            <input class="inp" id="rBaseOfferSearch" type="text" placeholder="Поиск по названию..."
                   oninput="filterBaseOffers(this.value)" autocomplete="off">
            <select class="inp" id="rBaseOffer" size="4" style="height:90px;margin-top:6px" onchange="onBaseOfferSelect(this)">
              <option value="">— не выбрано —</option>
            </select>
          </div>

          <!-- Кап + Название -->
          <div class="field span2">
            <label>Кап и название оффера *</label>
            <div class="cap-name-row">
              <select class="inp" id="rCap" onchange="onCapChange(this)">
                <option value="Unlimited">♾️ Unlimited</option>
                <option value="CAP10">10 fd/day</option>
                <option value="CAP15">15 fd/day</option>
                <option value="CAP20">20 fd/day</option>
                <option value="CAP25">25 fd/day</option>
                <option value="CAP30">30 fd/day</option>
                <option value="CAP35">35 fd/day</option>
                <option value="CAP40">40 fd/day</option>
                <option value="CAP45">45 fd/day</option>
                <option value="CAP50">50 fd/day</option>
                <option value="CAP60">60 fd/day</option>
                <option value="CAP70">70 fd/day</option>
                <option value="CAP80">80 fd/day</option>
                <option value="CAP90">90 fd/day</option>
                <option value="CAP100">100 fd/day</option>
                <option value="custom">✏️ Свой кап...</option>
              </select>
              <input class="inp" id="rCapCustom" type="number" min="1" placeholder="Введите число" style="display:none;flex:0 0 auto;width:130px" oninput="onCapCustomInput(this)">
              <input class="inp" id="rName" type="text" placeholder="Например: BetBoom RU">
            </div>
            <div style="margin-top:6px;font-size:.72em;color:var(--text2)" id="rCapPreview"></div>
          </div>

          <!-- GEO -->
          <div class="field">
            <label>GEO *</label>
            <input class="inp" id="rGeo" type="text" placeholder="RU, UA, KZ...">
          </div>

          <!-- Ставка + валюта -->
          <div class="field">
            <label>Ставка</label>
            <div class="rate-row">
              <input class="inp" id="rRate" type="text" placeholder="50">
              <select class="inp" id="rCurrency">
                <option value="USD">🇺🇸 USD $</option>
                <option value="EUR">🇪🇺 EUR €</option>
                <option value="BRL">🇧🇷 BRL R$</option>
                <option value="GBP">🇬🇧 GBP £</option>
                <option value="CAD">🇨🇦 CAD $</option>
                <option value="AUD">🇦🇺 AUD $</option>
                <option value="INR">🇮🇳 INR ₹</option>
                <option value="MXN">🇲🇽 MXN $</option>
                <option value="NGN">🇳🇬 NGN ₦</option>
                <option value="ZAR">🇿🇦 ZAR R</option>
                <option value="TRY">🇹🇷 TRY ₺</option>
                <option value="UAH">🇺🇦 UAH ₴</option>
                <option value="KZT">🇰🇿 KZT ₸</option>
                <option value="RUB">🇷🇺 RUB ₽</option>
                <option value="PLN">🇵🇱 PLN zł</option>
                <option value="CZK">🇨🇿 CZK Kč</option>
                <option value="RON">🇷🇴 RON lei</option>
                <option value="HUF">🇭🇺 HUF Ft</option>
              </select>
            </div>
          </div>

          <!-- URL -->
          <div class="field span2">
            <label>URL оффера <span style="color:var(--text2);font-size:.8em">(ваша партнёрская ссылка)</span></label>
            <input class="inp" id="rUrl" type="text" placeholder="https://...">
          </div>

          <!-- Postback -->
          <div class="field span2">
            <label>Postback URL <span style="color:var(--text2);font-size:.8em">(подставляется из вашей сети)</span></label>
            <input class="inp" id="rPostback" type="text" placeholder="https://...">
          </div>

          <!-- Комментарий -->
          <div class="field span2">
            <label>Комментарий</label>
            <textarea class="inp" id="rComment" rows="3" placeholder="Условия, ограничения, вопросы..." style="resize:vertical"></textarea>
          </div>
        </div>
        <div class="err-msg" id="rErr"></div>
        <div style="display:flex;gap:10px;margin-top:4px">
          <button class="btn primary" id="rBtn" onclick="submitRequest()">Отправить заявку</button>
          <button class="btn" onclick="clearForm()">Очистить</button>
        </div>
      </div>
    </div>

    <!-- MY REQUESTS PAGE -->
    <div class="page" id="page-requests">
      <div class="section-title">Мои заявки</div>
      <div id="requestsList"><div class="empty"><div class="spinner"></div></div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
  <script src="/static/js/partner.js"></script>
</body>
</html>
