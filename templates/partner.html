<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/partner.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">AFF <span>Panel</span></div>
    <div class="login-sub">Партнёрский кабинет</div>
    <div class="field">
      <label>Логин</label>
      <input class="inp" id="lUser" type="text" placeholder="username" autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input class="inp" id="lPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="err-msg" id="lErr"></div>
    <button class="btn primary full" id="lBtn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo">AFF <span>Panel</span></div>
    <div class="header-user">Вы вошли как <b id="hUser"></b></div>
    <div class="spacer"></div>
    <button class="btn" onclick="doLogout()">Выйти</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="my_offers" onclick="switchTab('my_offers')">Мои офферы</div>
    <div class="tab" data-tab="traffic" onclick="switchTab('traffic')">Трафик</div>
    <div class="tab" data-tab="new" onclick="switchTab('new')">＋ Заявка</div>
    <div class="tab" data-tab="invoices" onclick="switchTab('invoices')">
      Счета <span id="invBadge" style="display:none;margin-left:4px;background:#f59e0b;color:#000;border-radius:10px;padding:0 6px;font-size:.7rem"></span>
    </div>
    <div class="tab" data-tab="requests" onclick="switchTab('requests')">
      Мои заявки <span id="pendingBadge" style="display:none;margin-left:4px;background:#f59e0b;color:#000;border-radius:10px;padding:1px 6px;font-size:.7em"></span>
    </div>
  </div>

  <div class="main">

    <!-- OFFERS -->
    <div class="page active" id="page-my_offers">
      <div class="filter-bar">
        <button onclick="loadMyOffers(true)" class="btn" style="padding:5px 12px;font-size:.78rem">↺ Обновить</button>
        <div style="width:1px;height:20px;background:var(--border)"></div>
        <div style="display:flex;gap:2px">
          <button class="mo-platform-btn mo-platform-btn--active" data-platform="ios" onclick="setMyOffersPlatform('ios')"> iOS</button>
          <button class="mo-platform-btn" data-platform="android" onclick="setMyOffersPlatform('android')"> Android</button>
        </div>
        <div style="width:1px;height:20px;background:var(--border)"></div>
        <button class="filter-chip active" onclick="setMyOffersFilter('active', this)">
          <span class="filter-dot" style="background:#22c55e"></span> Активные
        </button>
        <button class="filter-chip" onclick="setMyOffersFilter('stopped', this)">
          <span class="filter-dot" style="background:#ef4444"></span> Стопнутые
        </button>
        <button class="filter-chip" onclick="setMyOffersFilter('all', this)">Все</button>
      </div>
      <div class="mo-layout">
        <div id="moGeoNav" class="mo-geo-nav" style="display:none"></div>
        <div id="myOffersList" class="mo-list"><div class="p-loading"><div class="p-spinner"></div><span>Загрузка...</span></div></div>
      </div>
    </div>

    <!-- INVOICES -->
    <div class="page" id="page-invoices">
      <div class="inv-layout">
        <div id="invoicesSidebar" class="inv-sidebar" style="display:none"></div>
        <div id="invoicesContent" class="inv-main"></div>
      </div>
    </div>

    <!-- TRAFFIC -->
    <div class="page" id="page-traffic">
      <div id="trafficContent"><div class="empty"><div class="empty-icon">⏳</div>Загрузка...</div></div>
    </div>

    <!-- NEW REQUEST -->
    <div class="page" id="page-new">
      <div class="section-title">Новая заявка</div>
      <div class="card">
        <div class="form-grid">
          <div class="field span2">
            <label>Подход *</label>
            <div class="chip-group" id="rApproachGroup">
              <div class="chip" data-val="Crash" onclick="toggleChip(this)">Crash</div>
              <div class="chip" data-val="Casino" onclick="toggleChip(this)">Casino</div>
              <div class="chip" data-val="Betting" onclick="toggleChip(this)">Betting</div>
            </div>
          </div>
          <div class="field span2">
            <label>Базовый оффер из Binom</label>
            <input class="inp" id="rBaseOfferSearch" type="text" placeholder="Поиск..." oninput="filterBaseOffers(this.value)" autocomplete="off">
            <select class="inp" id="rBaseOffer" size="4" style="height:90px;margin-top:6px" onchange="onBaseOfferSelect(this)">
              <option value="">— не выбрано —</option>
            </select>
          </div>
          <div class="field span2">
            <label>Кап и название *</label>
            <div class="cap-name-row">
              <select class="inp" id="rCap" onchange="onCapChange(this)">
                <option value="Unlimited">Unlimited</option>
                <option value="CAP10">10 fd/day</option>
                <option value="CAP15">15 fd/day</option>
                <option value="CAP20">20 fd/day</option>
                <option value="CAP25">25 fd/day</option>
                <option value="CAP30">30 fd/day</option>
                <option value="CAP35">35 fd/day</option>
                <option value="CAP40">40 fd/day</option>
                <option value="CAP50">50 fd/day</option>
                <option value="CAP70">70 fd/day</option>
                <option value="CAP100">100 fd/day</option>
                <option value="custom">Свой...</option>
              </select>
              <input class="inp" id="rCapCustom" type="number" min="1" placeholder="Число" style="display:none;flex:0 0 auto;width:110px" oninput="onCapCustomInput(this)">
              <input class="inp" id="rName" type="text" placeholder="Название оффера">
            </div>
            <div style="margin-top:5px;font-size:.72em;color:var(--text3)" id="rCapPreview"></div>
          </div>
          <div class="field">
            <label>GEO *</label>
            <input class="inp" id="rGeo" type="text" placeholder="RU, UA, KZ...">
          </div>
          <div class="field">
            <label>Ставка</label>
            <div class="rate-row">
              <input class="inp" id="rRate" type="text" placeholder="50">
              <select class="inp" id="rCurrency">
                <option value="USD">USD</option><option value="EUR">EUR</option>
                <option value="BRL">BRL</option><option value="GBP">GBP</option>
                <option value="TRY">TRY</option><option value="UAH">UAH</option>
                <option value="PLN">PLN</option><option value="KZT">KZT</option>
              </select>
            </div>
          </div>
          <div class="field span2">
            <label>URL оффера</label>
            <input class="inp" id="rUrl" type="text" placeholder="https://...">
          </div>
          <div class="field span2">
            <label>Postback URL</label>
            <input class="inp" id="rPostback" type="text" placeholder="https://...">
          </div>
          <div class="field span2">
            <label>Комментарий</label>
            <textarea class="inp" id="rComment" rows="3" placeholder="Условия, ограничения..." style="resize:vertical"></textarea>
          </div>
        </div>
        <div class="err-msg" id="rErr"></div>
        <div style="display:flex;gap:10px;margin-top:4px">
          <button class="btn primary" id="rBtn" onclick="submitRequest()">Отправить заявку</button>
          <button class="btn" onclick="clearForm()">Очистить</button>
        </div>
      </div>
    </div>

    <!-- MY REQUESTS -->
    <div class="page" id="page-requests">
      <div class="section-title">Мои заявки</div>
      <div id="requestsList"><div class="empty"><div class="empty-icon">📨</div>Заявок ещё нет</div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/partner.js"></script>
</body>
</html>
